server {
    set $docroot /oneposda/install/web/www;
    set $certroot /oneposda/install/certs;

    listen 80 default_server;
    listen [::]:80 default_server;

    listen 443 default_server ssl;
    ssl_certificate /oneposda/install/certs/nginx.crt;
    ssl_certificate_key /oneposda/install/certs/nginx.key;

    # Disable checking of client body size
    client_max_body_size 0;

    root $docroot;

    index index.html index.htm index.nginx-debian.html;

    server_name _;

    # Default location - should just show some links.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fix for Swagger API docs (/papi/docs)
    location /openapi.json {
        proxy_pass http://localhost:8087/openapi.json;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout  300;
    }

    location /ohif {
        alias $docroot/ohif;
        try_files $uri /$uri /ohif/index.html;
    }

    # Kaleidoscope API
    location /api {
        proxy_pass http://localhost:8089;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout  300;
    }

    # Posda API
    location /papi/ {
        proxy_pass http://localhost:8087/;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout  300;
    }

    # Quince
    location /viewer {
        alias $docroot/quince;
        try_files $uri /$uri /viewer/index.html;
    }

    # Mirabelle
    location /mira {
        alias $docroot/mira;
        try_files $uri /$uri /mira/index.html;
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
    }

    # Kohlrabi
    location /kohlrabi/ {
        alias $docroot/kohlrabi/;
        try_files $uri /$uri /kohlrabi/index.html;
    }

    # Kaleidoscope
    location /k {
        alias /kaleidoscope;
        try_files $uri /$uri /k/index.html;
    }

    location /dashboard {
        try_files $uri /$uri /dashboard/index.html;
    }
    # DICOM Roots Editor
    location /roots {
        alias $docroot/roots;
        try_files $uri /$uri /roots/index.html;
    }


    location /posda/ {
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://localhost:64610/;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout  300;
    }
    location /pa1/ {
        proxy_pass http://localhost:64615/;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout  300;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        error_page 502 /posda-error.html;
    }
    location /pa2/ {
        proxy_pass http://localhost:64616/;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
